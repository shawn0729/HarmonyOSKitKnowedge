  image-kit-development:
    source: harmonyos-sdk/skills/image-kit-development
    hosts:
      arkts-system-capabilities:
        trigger_scope:
          - PixelMap
          - ImageSource
          - ImagePacker
          - ImageReceiver
          - image processing
          - image encoding
          - image decoding
        required_topics:
          - image-kit
          - api-and-error-codes
          - best-practices-and-faq
      arkts-ui-alignment:
        trigger_scope:
          - image display fidelity
          - PixelMap visual conversion
        required_topics:
          - image-editing-and-processing
          - image-decoding
      android2hmos_resources_convert:
        trigger_scope:
          - image resource conversion
