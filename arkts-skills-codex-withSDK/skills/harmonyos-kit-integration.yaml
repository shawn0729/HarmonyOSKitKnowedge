      hmos-env-doctor:
        trigger_scope:
          - runtime diagnostics
          - environment diagnostics
          - performance analysis
        required_topics:
          - overview-and-routing
          - best-practices-and-faq
      arkts-codebase-debug:
        trigger_scope:
          - crash analysis
          - AppFreeze
          - resource leak
          - fault analysis
        required_topics:
