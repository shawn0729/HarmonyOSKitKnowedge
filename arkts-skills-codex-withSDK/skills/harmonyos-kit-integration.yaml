        trigger_scope:
          - sandbox path
          - file access
          - file management
          - file sharing
          - storage statistics
          - backup restore
        required_topics:
          - overview-and-routing
          - api-and-error-codes
          - best-practices-and-faq
      arkts-download-manager:
