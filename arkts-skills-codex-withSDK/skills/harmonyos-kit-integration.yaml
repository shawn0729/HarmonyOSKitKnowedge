schema_version: 1

source_root: harmonyos-sdk/skills
target_root: arkts-skills-codex/skills

fused_kits:
  arkui-development:
    source: harmonyos-sdk/skills/arkui-development
    hosts:
      arkts-component-builder:
        trigger_scope:
          - ArkUI components
          - layout containers
          - custom components
          - ForEach and LazyForEach
          - Repeat rendering
          - component reuse
        required_topics:
          - component-composition
          - rendering-navigation
          - styling-animation
          - best-practices-and-faq
      arkts-state-manager:
        trigger_scope:
          - ArkUI state decorators
          - parent child state sync
          - app level state
          - UI refresh issues
        required_topics:
          - state-management
          - best-practices-and-faq
      arkts-navigation-builder:
        trigger_scope:
          - Navigation
          - NavPathStack
          - NavDestination
          - page routing
        required_topics:
          - rendering-navigation
      arkts-animation-builder:
        trigger_scope:
          - ArkUI animation
          - transition
          - style animation
        required_topics:
          - styling-animation
      arkts-ui-alignment:
        trigger_scope:
          - ArkUI visual alignment
          - layout fidelity
          - style mapping
        required_topics:
          - styling-animation
          - component-composition
      arkts-knowledge-verifier:
        trigger_scope:
          - ArkUI API uncertainty
          - component attribute uncertainty
          - decorator uncertainty
        required_topics:
          - api-map
          - overview-and-routing

  arkts-development:
    source: harmonyos-sdk/skills/arkts-development
    hosts:
      arkts-knowledge-verifier:
        trigger_scope:
          - ArkTS language restrictions
          - XML parsing
          - JSON extension
          - Buffer
          - container classes
        required_topics:
          - overview-and-routing
          - api-and-error-codes
      arkts-data-layer:
        trigger_scope:
          - JSON parsing
          - XML conversion
          - Buffer data handling
        required_topics:
          - overview-and-routing

  arkdata-development:
    source: harmonyos-sdk/skills/arkdata-development
    hosts:
      arkts-data-layer:
        trigger_scope:
          - Preferences
          - RDB
          - relationalStore
          - standardized data
          - distributed data
          - cross application data sharing
        required_topics:
          - overview-and-routing
          - api-and-error-codes
          - best-practices-and-faq
      arkts-state-manager:
        trigger_scope:
          - persisted state
          - Preferences backed state
        required_topics:
          - overview-and-routing
          - best-practices-and-faq

  network-kit-development:
    source: harmonyos-sdk/skills/network-kit-development
    hosts:
      arkts-data-layer:
        trigger_scope:
          - HTTP
          - WebSocket
          - Socket
          - MDNS
          - network status
          - VPN
          - network errors
        required_topics:
          - network-kit
          - api-and-error-codes
          - best-practices-and-faq
      arkts-download-manager:
        trigger_scope:
          - large file download
          - download cancellation
          - download concurrency
          - weak network recovery
          - network status during download
        required_topics:
          - network-kit
          - api-and-error-codes
          - best-practices-and-faq
      arkts-knowledge-verifier:
        trigger_scope:
          - Network Kit import uncertainty
          - Network Kit error code uncertainty
        required_topics:
          - api-and-error-codes
          - overview-and-routing

  ability-kit-development:
    source: harmonyos-sdk/skills/ability-kit-development
